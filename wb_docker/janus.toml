################################################################
# Global configuration
################################################################
port = @HTTP_PORT@

[log]
  level = "@LOG_LEVEL@"

################################################################
# API configuration backend
################################################################
[web]
  port = @ADMIN_HTTP_PORT@

  [web.credentials]
    secret = "@ADMIN_JWT_SECRET@"

    [web.credentials.basic]
    users = {admin = "@ADMIN_BASIC_PASS@"}

[database]
  dsn = "file:///etc/janus"

################################################################
# Tracing configuration (OpenTelemetry/OpenCensus)
################################################################
[tracing]
  exporter = "@TRACING_EXPORTER@"
  service_name = "@TRACING_SERVICE_NAME@"
  sampling_param = @TRACING_SAMPLING_PARAM@

  # OTLP configuration (when exporter = "otlp")
  [tracing.otlp]
    endpoint = "@TRACING_OTLP_ENDPOINT@"
    protocol = "@TRACING_OTLP_PROTOCOL@"
    insecure = @TRACING_OTLP_INSECURE@
