# See https://golangci-lint.run/usage/configuration/#config-file for more information
run:
  timeout: 5m
  modules-download-mode: readonly
  allow-parallel-runners: true
  concurrency: 4

linters:
  disable-all: true
  enable:
    - gofmt
    - goimports
  fast: false
linters-settings:
  gofmt:
    simplify: false
issues:
  exclude-use-default: false
